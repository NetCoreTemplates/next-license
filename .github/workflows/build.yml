name: Build
on:
  pull_request: {}
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Node runs the .NET-to-Node JWT compatibility tests, the client job checks MyApp.Client
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Backend and compatibility tests
        run: dotnet test MyApp.Tests/MyApp.Tests.csproj -m:1
      - name: Offline sample
        run: dotnet run --project MyApp.SampleApp
      - name: Build key tooling
        run: dotnet build MyApp.Licensing.Tool/MyApp.Licensing.Tool.csproj

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Vite+ and install npm dependencies
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          working-directory: ./MyApp.Client
          cache: true
      - name: Check (format, lint, type check)
        run: vp check
        working-directory: MyApp.Client
      - name: Component tests
        run: vp test run
        working-directory: MyApp.Client
      - name: Static export
        run: npm run build
        working-directory: MyApp.Client
