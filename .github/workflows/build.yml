name: Build
on:
  pull_request: {}
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MyApp.Client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: MyApp.Client
      - name: Backend and compatibility tests
        run: dotnet test MyApp.Tests/MyApp.Tests.csproj -m:1
      - name: Offline sample
        run: dotnet run --project MyApp.SampleApp
      - name: Build key tooling
        run: dotnet build MyApp.Licensing.Tool/MyApp.Licensing.Tool.csproj
      - name: Static export, typecheck, and component tests
        run: |
          npm run build
          npm run typecheck
          npm run test:run
        working-directory: MyApp.Client
