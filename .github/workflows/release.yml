name: Release
permissions:
  packages: write
  contents: write
on:
  workflow_run:
    workflows: ["Build Container"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      seed_example_data:
        description: "Populate a fresh preview database with example data"
        type: boolean
        default: false

env:
  DOCKER_BUILDKIT: 1
  SERVICESTACK_LICENSE: ${{ secrets.SERVICESTACK_LICENSE }}
  APPSETTINGS_JSON: ${{ secrets.APPSETTINGS_JSON }}
  KAMAL_DEPLOY_IP: ${{ secrets.KAMAL_DEPLOY_IP }}
  KAMAL_DEPLOY_HOST: ${{ secrets.KAMAL_DEPLOY_HOST }}
  KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
  KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  DB_PROVIDER: ${{ vars.DB_PROVIDER || 'sqlite' }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  MSSQL_PID: ${{ vars.MSSQL_PID || 'Express' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check deployment secrets
        id: check
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=()
          for name in SSH_PRIVATE_KEY KAMAL_DEPLOY_IP KAMAL_DEPLOY_HOST APPSETTINGS_JSON; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::Missing deployment secrets: ${missing[*]}"
              exit 1
            fi
            echo "::notice::Skipping automatic deployment; missing secrets: ${missing[*]}"
            echo "Deployment skipped. Configure these Actions secrets to enable it: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: preflight
    runs-on: ubuntu-latest
    if: ${{ needs.preflight.outputs.configured == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Encode APPSETTINGS_JSON for runtime
        if: env.APPSETTINGS_JSON != null
        run: |
          # Base64 encode to avoid shell/YAML quoting issues; keep as a single env var.
          b64=$(printf '%s' "$APPSETTINGS_JSON" | base64 -w0)
          echo "APPSETTINGS_JSON_BASE64=$b64" >> $GITHUB_ENV

      - name: Set up environment variables
        run: |
          echo "IMAGE=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          repo_name="$(echo ${{ github.repository }} | cut -d '/' -f 2)"
          echo "SERVICE=$(echo $repo_name | tr '[:upper:]' '[:lower:]' | tr '.' '-')" >> $GITHUB_ENV
          if find . -maxdepth 2 -type f -name "Configure.Db.Migrations.cs" | grep -q .; then
            echo "HAS_MIGRATIONS=true" >> $GITHUB_ENV
          else
            echo "HAS_MIGRATIONS=false" >> $GITHUB_ENV
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: true

      - name: Install Kamal
        run: gem install kamal -v 2.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=moby/buildkit:master

      - name: Validate database destination
        run: |
          case "$DB_PROVIDER" in sqlite|postgres|mysql|sqlserver) ;; *) echo 'Unsupported DB_PROVIDER' >&2; exit 1 ;; esac
          test -f "config/deploy.$DB_PROVIDER.yml"
          if [ "$DB_PROVIDER" != sqlite ]; then test -n "$DB_PASSWORD"; fi

      - name: Kamal bootstrap
        run: |
          kamal server bootstrap -d "$DB_PROVIDER"

      - name: Ensure directories exist with correct permissions
        run: |
          echo "Creating directories with correct permissions"
          kamal server exec -d "$DB_PROVIDER" "mkdir -p /opt/docker/${{ env.SERVICE }}/App_Data /opt/docker/${{ env.SERVICE }}/initdb.d"

          echo "Setting app file permissions"
          kamal server exec -d "$DB_PROVIDER" "chown -R 1654:1654 /opt/docker/${{ env.SERVICE }}/App_Data /opt/docker/${{ env.SERVICE }}/initdb.d"

      - name: Database provider pre-deploy hook
        run: |
          hook="config/db/$DB_PROVIDER/pre-deploy.sh"
          if [ -x "$hook" ]; then "$hook"; fi

      - name: Verify file permissions before deploy
        run: |
          kamal server exec -d "$DB_PROVIDER" --no-interactive "chown -R 1654:1654 /opt/docker/${{ env.SERVICE }}/App_Data /opt/docker/${{ env.SERVICE }}/initdb.d"

      - name: Deploy with Kamal
        run: |
          kamal lock release -v -d "$DB_PROVIDER"
          kamal server exec -d "$DB_PROVIDER" --no-interactive 'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin'
          kamal server exec -d "$DB_PROVIDER" --no-interactive 'docker pull ${{ env.IMAGE }}:latest'
          kamal deploy -P -d "$DB_PROVIDER" --version latest

      - name: Migration
        if: env.HAS_MIGRATIONS == 'true'
        run: |
          kamal app exec -d "$DB_PROVIDER" --no-reuse --no-interactive --version=latest "--AppTasks=migrate"

      - name: Seed example data for preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_example_data }}
        run: |
          password="$(openssl rand -base64 48)"
          kamal app exec -d "$DB_PROVIDER" --no-reuse --no-interactive --version=latest \
            --env ALLOW_EXAMPLE_DATA_SEEDING:true \
            --env "EXAMPLE_DATA_PASSWORD:$password" \
            "--AppTasks=seed-example-data"
